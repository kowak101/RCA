<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RCA — Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f4;font-family:Inter,Arial,sans-serif;color:#232323}
    .card{max-width:520px;width:calc(100% - 32px);background:#fff;border:1px solid #e6e6e6;border-radius:12px;padding:28px;box-shadow:0 12px 28px rgba(0,0,0,.06);text-align:center}
    h1{margin:0 0 10px;font-size:20px}
    p{margin:0 0 18px;color:#606060;line-height:1.5}
    a.btn{display:inline-block;background:#b00008;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>Jesteś offline</h1>
    <p>Brak połączenia z internetem. Aplikacja RCA powinna działać lokalnie — niektóre zasoby mogą być jednak niedostępne.</p>
    <a class="btn" href="/">Powrót do aplikacji</a>
  </main>
</body>
</html>
