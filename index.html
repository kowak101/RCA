<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#232323">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <title>RCA System — Analiza Przyczyn Źródłowych</title>
  <meta name="description" content="Lokalna aplikacja do zarządzania procesem Root Cause Analysis. Komputer i telefon w jednym pliku. 100% offline.">
  <style>
    body{margin:0;background:#f4f4f4;font-family:Inter,Arial,sans-serif;color:#232323}
    #app{min-height:100vh}
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('RCA: service worker registered'))
          .catch((err) => console.warn('RCA: service worker registration failed', err));
      });
    }
  </script>
</body>
</html>
